[package]
name = "zcash-hw-wallet-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Transport-agnostic SDK for signing Zcash shielded (Ironwood + sealed-Orchard turnstile) transactions via hardware wallets using the PCZT standard"
repository = "https://github.com/wh00hw/zcash-hw-wallet-sdk"
keywords = ["zcash", "hardware-wallet", "pczt", "orchard", "ironwood"]
categories = ["cryptography", "hardware-support"]

[features]
default = ["serial"]
serial = ["dep:serialport"]
ledger = ["dep:hidapi"]
tcp = []
qr = ["dep:qrcode", "dep:image", "dep:rqrr", "dep:ur"]

[dependencies]
# Error handling
anyhow = "1"
thiserror = "2"

# Serialization & encoding
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"

# Security hardening
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
blake2b_simd = "1"

# Platform CSPRNG (/dev/urandom / getrandom(2) on Unix, BCryptGenRandom on
# Windows) via `rand::rngs::SysRng`. Used for fresh attestation challenge
# nonces (audit M1) and handed to the pczt 0.10 Prover role, which no longer
# draws OS randomness itself. Same major versions as the rest of the
# rand_core consumers in the orchard / pczt dependency tree.
rand_core = "0.10"
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }

# Zcash crates — the NU7 release set of 2026-10-21 (NU6.3 + NU7 consensus
# branches; v6 transaction format; MSRV 1.89)
pczt = { version = "0.10.0", features = ["io-finalizer", "prover", "signer", "spend-finalizer", "tx-extractor"] }
orchard = "0.16.0"
reddsa = "0.6"
ff = "0.14"
# Used in workflow.rs to open each output's enc_ciphertext with (pk_d, esk)
# rebuilt from the PCZT, so the memo plaintext can be forwarded to the device
# for on-chip enc_ciphertext recomputation (memo-verifying protocol).
zcash_note_encryption = "0.5"
zcash_address = "0.14.0"
zcash_primitives = "0.31.0"
zcash_protocol = "0.11.0"

# Serial transport (optional)
serialport = { version = "4", optional = true }

# Ledger HID transport (optional)
hidapi = { version = "2", optional = true }

# QR transport (optional)
qrcode = { version = "0.14", optional = true }
image = { version = "0.25", optional = true }
rqrr = { version = "0.8", optional = true }
ur = { version = "0.4", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
blake2b_simd = "1"
# tests/integration.rs builds a real NU7 v6 PCZT (zcash_primitives Builder ->
# pczt Creator::build_from_parts) and drives it through the whole workflow
# against the virtual device.
pczt = { version = "0.10.0", features = ["zcp-builder"] }
incrementalmerkletree = "0.9"
# tests/integration.rs also builds transactions with transparent outputs and
# (for the transparent-input sighash checks) transparent inputs.
zcash_transparent = { version = "0.11", features = ["transparent-inputs"] }
zcash_primitives = { version = "0.31.0", features = ["transparent-inputs"] }
# tests/integration.rs: the public key of the transparent coin in the
# transparent-input fixtures (which host and device both refuse).
secp256k1 = "0.33"

# NOTE: no [patch.crates-io] here — the standalone build resolves the
# NU7 release stack straight from crates.io (pczt 0.10.0, orchard
# 0.16.0). When built as a path dependency of zipher-app, the workspace
# root may still patch the zcash crates to a pinned librustzcash revision.
